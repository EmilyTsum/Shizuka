<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>Open Shizuka</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; padding: max(28px, env(safe-area-inset-top)) 24px 32px; }
    main { max-width: 28rem; margin: 12vh auto 0; }
    h1 { font-size: 2rem; margin: 0 0 20px; }
    p { line-height: 1.55; }
    button { min-height: 48px; padding: 12px 22px; margin: 12px 0; border: 0; border-radius: 24px; font: inherit; }
    .hint { font-size: .9rem; opacity: .75; }
  </style>
  <script src="launcher.js" defer></script>
</head>
<body>
  <main>
    <h1>Shizuka</h1>
    <p id="launch-status" role="status" aria-live="polite">Opening native settings…</p>
    <button id="open-native" type="button">Open Shizuka</button>
    <p class="hint">All settings are in the native Shizuka interface. If it does not open, use this module’s Action in KernelSU.</p>
  </main>
</body>
</html>
